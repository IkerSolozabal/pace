<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pace — Calculadora de ritmos de carrera</title>
  <meta name="description" content="Calculadora de ritmos para correr en ruta y en pista: calcula ritmo, tiempo o distancia y obtén los parciales cada km, 400 m o 200 m.">
  <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="Pace — Calculadora de ritmos">
  <meta property="og:description" content="Ritmo, tiempo y distancia con parciales para ruta y pista.">
  <meta property="og:url" content="https://pace.sogra.es/">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body data-mode="ruta">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app">
    <header class="top">
      <a class="brand" href="./" aria-label="Pace, inicio">pace<span>.</span></a>
      <div class="seg seg-sm" id="modeSeg" role="radiogroup" aria-label="Modo">
        <button type="button" role="radio" data-value="ruta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c4-2 5-6 8-8s6-2 8-8"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/></svg>
          Ruta
        </button>
        <button type="button" role="radio" data-value="pista">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><rect x="7" y="9.5" width="10" height="5" rx="2.5"/></svg>
          Pista
        </button>
        <span class="seg-thumb" aria-hidden="true"></span>
      </div>
    </header>

    <div class="layout">
      <section class="card form" aria-label="Datos">
        <div class="row-head">
          <h2 class="eyebrow">¿Qué quieres calcular?</h2>
          <button type="button" class="icon-btn" id="reset" aria-label="Restablecer" title="Restablecer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </button>
        </div>
        <div class="seg" id="targetSeg" role="radiogroup" aria-label="Magnitud a calcular">
          <button type="button" role="radio" data-value="pace">Ritmo</button>
          <button type="button" role="radio" data-value="time">Tiempo</button>
          <button type="button" role="radio" data-value="distance">Distancia</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>

        <div class="pista-only lap-row">
          <span class="eyebrow">Vuelta</span>
          <div class="seg seg-sm" id="lapSeg" role="radiogroup" aria-label="Longitud del parcial en pista">
            <button type="button" role="radio" data-value="200">200 m</button>
            <button type="button" role="radio" data-value="400">400 m</button>
            <span class="seg-thumb" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field" data-field="distance">
          <div class="field-head">
            <label for="dist">Distancia</label>
            <span class="badge">Resultado</span>
          </div>
          <div class="inputs">
            <input class="num grow" id="dist" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="distUnit">
            <span class="u" id="distUnit">km</span>
          </div>
          <div class="chips" id="presets" role="group" aria-label="Distancias habituales"></div>
        </div>

        <div class="field" data-field="time">
          <div class="field-head">
            <label for="th">Tiempo</label>
            <span class="badge">Resultado</span>
          </div>
          <div class="inputs">
            <input class="num" id="th" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Horas"><span class="u">h</span>
            <input class="num" id="tm" type="text" inputmode="numeric" autocomplete="off" placeholder="00" aria-label="Minutos"><span class="u">m</span>
            <input class="num" id="ts" type="text" inputmode="decimal" autocomplete="off" placeholder="00" aria-label="Segundos"><span class="u">s</span>
          </div>
        </div>

        <div class="field" data-field="pace">
          <div class="field-head">
            <label for="pm">Ritmo</label>
            <span class="badge">Resultado</span>
            <div class="seg seg-xs pista-only" id="unitSeg" role="radiogroup" aria-label="Unidad del ritmo">
              <button type="button" role="radio" data-value="km">/km</button>
              <button type="button" role="radio" data-value="lap">/vuelta</button>
              <span class="seg-thumb" aria-hidden="true"></span>
            </div>
          </div>
          <div class="inputs">
            <input class="num" id="pm" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Minutos de ritmo"><span class="u colon">:</span>
            <input class="num" id="ps" type="text" inputmode="decimal" autocomplete="off" placeholder="00" aria-label="Segundos de ritmo">
            <span class="u" id="paceUnit">/km</span>
          </div>
        </div>
      </section>

      <div class="side">
        <section class="card result" aria-live="polite" aria-label="Resultado">
          <div class="hero">
            <span class="eyebrow" id="heroLabel">Ritmo</span>
            <div class="hero-value"><span id="heroValue">—</span><small id="heroUnit"></small></div>
          </div>
          <dl class="stats" id="stats"></dl>
          <button type="button" class="share" id="share">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            Compartir cálculo
          </button>
        </section>

        <section class="card splits" aria-label="Parciales">
          <div class="row-head">
            <h2 class="eyebrow">Parciales <span class="muted" id="splitsStep">cada 1 km</span></h2>
            <span class="muted small" id="splitsCount"></span>
          </div>
          <div class="table" role="table" aria-label="Tabla de parciales">
            <div class="thead" role="row">
              <span role="columnheader">Distancia</span>
              <span role="columnheader">Parcial</span>
              <span role="columnheader">Acumulado</span>
            </div>
            <div class="rows" id="rows" role="rowgroup"></div>
          </div>
        </section>
      </div>
    </div>

    <footer class="foot">
      <span>Ritmo constante · Cálculos en tu navegador</span>
      <a href="https://github.com/IkerSolozabal/pace" rel="noopener">GitHub</a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
